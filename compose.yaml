include:
  - llm/compose.yaml  # el servicio ollama

services:
  voz:
    build: .
    user: "1000:1000"  # tu usuario: así los archivos de ./modelos son tuyos y no de root
    environment:
      # Más grande: más preciso, pero más lento y con más RAM. Los ".en" solo entienden inglés.
      #   tiny, tiny.en          76 MB
      #   base, base.en         145 MB
      #   small, small.en       484 MB
      #   medium, medium.en     1,5 GB
      #   large-v1, large-v2    3,1 GB
      # Existen, pero entrypoint.sh aún no puede descargarlos:
      #   large-v3              3,1 GB   (usa otros archivos)
      #   large, turbo, large-v3-turbo, distil-*   (están en otros repositorios)
      MODELO_WHISPER: medium
      DISPOSITIVO: auto  # auto, cuda o cpu
    # Da acceso a la GPU NVIDIA (necesita el driver y nvidia-container-toolkit en el host).
    # Sin GPU, comenta este bloque y usará la CPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8766:8766"
    volumes:
      - ./modelos:/app/modelos

  orquestador:
    build: orquestador
    environment:
      # Si Voz corre en otro computador, pon su dirección en un archivo .env (no se sube a git)
      URL_VOZ: ${URL_VOZ:-ws://voz:8766/transcribir}
      URL_OLLAMA: http://ollama:11434
      MODELO_LLM: qwen2.5:3b
    ports:
      - "127.0.0.1:8768:8768"

  web:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8767:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
